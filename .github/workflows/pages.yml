name: Publish domestic AI to GitHub Pages

on:
  push:
    branches: [domestic-AI]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-domestic
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/domestic-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out domestic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read GitHub Pages configuration
        # Enable Pages with the GitHub Actions source in repository Settings first.
        # enablement:true cannot use the ordinary GITHUB_TOKEN to enable a new site.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build and verify static personal-key edition
        run: npm run build:pages
        env:
          NEXT_PUBLIC_DEPLOYMENT_TARGET: github-pages
          NEXT_PUBLIC_BASE_PATH: /exam-grading-assistant
      - name: Upload only the checked static export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
